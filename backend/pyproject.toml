[tool.mypy]
plugins = "sqlalchemy.ext.mypy.plugin"
mypy_path = "$MYPY_CONFIG_FILE_DIR"
explicit_package_bases = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[tool.ruff]
ignore = []
line-length = 130
select = [
    "E",
    "F",
    "W",
]
