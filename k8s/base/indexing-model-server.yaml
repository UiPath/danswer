# Runs as uid 1001 (upstream image runs as root by default). The model cache
# volume is mounted at /model-cache (was /root/.cache) with HF_HOME pointing
# into it; fsGroup makes the existing cached files readable.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: indexing-model-server-statefulset
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 2
  selector:
    matchLabels:
      app: indexing-model-server
      name: indexing-model-server
  serviceName: indexing-model-server-service
  template:
    metadata:
      labels:
        app: indexing-model-server
        name: indexing-model-server
    spec:
      containers:
      - command:
        - uvicorn
        - model_server.main:app
        - --host
        - 0.0.0.0
        - --port
        - '9000'
        env:
        - name: INDEXING_ONLY
          value: 'True'
        - name: HF_HOME
          value: /model-cache/huggingface
        - name: HOME
          value: /tmp
        envFrom:
        - configMapRef:
            name: env-configmap
        image: danswer-model-server
        imagePullPolicy: IfNotPresent
        name: indexing-model-server
        ports:
        - containerPort: 9000
          protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 1536Mi
          limits:
            cpu: '8'      # = node size: satisfies the limits policy, no throttling
            memory: 4Gi
        volumeMounts:
        - mountPath: /model-cache
          name: indexing-model-storage
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      volumes:
      - name: tmp
        emptyDir: {}
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      name: indexing-model-storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      volumeMode: Filesystem
    status:
      phase: Pending
---
apiVersion: v1
kind: Service
metadata:
  name: indexing-model-server-service
spec:
  ports:
  - name: indexing-model-server-port
    port: 9000
    protocol: TCP
    targetPort: 9000
  selector:
    app: indexing-model-server
  type: ClusterIP
