apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: indexing-model-server-statefulset
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 2
  selector:
    matchLabels:
      app: indexing-model-server
      name: indexing-model-server
  serviceName: indexing-model-server-service
  template:
    metadata:
      labels:
        app: indexing-model-server
        name: indexing-model-server
    spec:
      containers:
      - command:
        - uvicorn
        - model_server.main:app
        - --host
        - 0.0.0.0
        - --port
        - '9000'
        env:
        - name: INDEXING_ONLY
          value: 'True'
        envFrom:
        - configMapRef:
            name: env-configmap
        image: danswer-model-server
        imagePullPolicy: IfNotPresent
        name: indexing-model-server
        ports:
        - containerPort: 9000
          protocol: TCP
        resources: {}
        volumeMounts:
        - mountPath: /root/.cache
          name: indexing-model-storage
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      name: indexing-model-storage
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      volumeMode: Filesystem
    status:
      phase: Pending
---
apiVersion: v1
kind: Service
metadata:
  name: indexing-model-server-service
spec:
  ports:
  - name: indexing-model-server-port
    port: 9000
    protocol: TCP
    targetPort: 9000
  selector:
    app: indexing-model-server
  type: ClusterIP
