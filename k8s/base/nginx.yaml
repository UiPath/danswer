# nginx runs unprivileged (nginxinc/nginx-unprivileged, uid 101): it listens on
# 8080 inside the pod; the Service still exposes port 80 so nothing upstream changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - 'while :; do sleep 6h & wait $$!; nginx -s reload; done & nginx -g "daemon
          off;"

          '
        env:
        - name: DOMAIN
          valueFrom:
            configMapKeyRef:
              key: DOMAIN
              name: env-configmap
        image: nginx
        imagePullPolicy: IfNotPresent
        name: nginx
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          name: nginx-conf
        - mountPath: /tmp
          name: tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - configMap:
          defaultMode: 420
          name: nginx-configmap
        name: nginx-conf
      - name: tmp
        emptyDir: {}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  - name: danswer
    port: 3000
    protocol: TCP
    targetPort: 8080
  selector:
    app: nginx
  type: ClusterIP
---
apiVersion: v1
data:
  nginx.conf: "upstream api_server {\n    server api-server-service:80 fail_timeout=0;\n\
    }\n\nupstream web_server {\n    server web-server-service:80 fail_timeout=0;\n\
    }\n\nserver {\n    listen 8080;\n    server_name $$DOMAIN;\n\n    client_max_body_size\
    \ 5G;    # Maximum upload size\n\n    # FastAPI's interactive docs / schema map every API route: don't serve\n    # them publicly. Regex runs on nginx's normalized URI (slashes merged,\n    # %XX decoded, dot-segments resolved), so encoding tricks don't bypass it.\n    location ~* ^/api/(docs|redoc|openapi\\.json)(/|$) {\n        return 404;\n    }\n\n    location ~ ^/api(.*)$ {\n        rewrite\
    \ ^/api(/.*)$ $1 break;\n        proxy_set_header X-Real-IP $remote_addr;\n  \
    \      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header\
    \ X-Forwarded-Proto $scheme;\n        proxy_set_header X-Forwarded-Host $host;\n\
    \        proxy_set_header Host $host;\n        proxy_http_version 1.1;\n     \
    \   proxy_buffering off;\n        proxy_redirect off;\n        proxy_pass http://api_server;\n\
    \    }\n\n    location / {\n        proxy_set_header X-Real-IP $remote_addr;\n\
    \        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n      \
    \  proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_set_header X-Forwarded-Host\
    \ $host;\n        proxy_set_header Host $host;\n        proxy_http_version 1.1;\n\
    \        proxy_redirect off;\n        proxy_pass http://web_server;\n    }\n}\n"
kind: ConfigMap
metadata:
  name: nginx-configmap
