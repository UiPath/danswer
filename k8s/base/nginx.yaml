# nginx runs unprivileged (nginxinc/nginx-unprivileged, uid 101): it listens on
# 8080 inside the pod; the Service still exposes port 80 so nothing upstream changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - 'while :; do sleep 6h & wait $$!; nginx -s reload; done & nginx -g "daemon
          off;"

          '
        env:
        - name: DOMAIN
          valueFrom:
            configMapKeyRef:
              key: DOMAIN
              name: env-configmap
        image: nginx
        imagePullPolicy: IfNotPresent
        name: nginx
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          name: nginx-conf
        - mountPath: /tmp
          name: tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - configMap:
          defaultMode: 420
          name: nginx-configmap
        name: nginx-conf
      - name: tmp
        emptyDir: {}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  - name: danswer
    port: 3000
    protocol: TCP
    targetPort: 8080
  selector:
    app: nginx
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configmap
data:
  nginx.conf: |
    upstream api_server {
        server api-server-service:80 fail_timeout=0;
    }

    upstream web_server {
        server web-server-service:80 fail_timeout=0;
    }

    # Real client IP. The Istio ingress gateway appends the client address to
    # X-Forwarded-For; trust ONLY in-cluster hops (the sidecar's 127.0.0.6 and
    # the pod subnet) so a client-supplied X-Forwarded-For can't spoof it.
    set_real_ip_from 127.0.0.6;
    set_real_ip_from 10.224.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Per-client-IP flood protection. Deliberately generous: everyone on the
    # corporate VPN shares a few egress IPs, so these only stop one source
    # hammering the service, not normal (office-wide) use.
    limit_req_zone $binary_remote_addr zone=per_ip_api:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=per_ip_auth:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=per_ip_web:20m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:20m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 8080;
        server_name $$DOMAIN;

        client_max_body_size 5G;    # Maximum upload size
        client_header_timeout 15s;  # slow-header (slowloris) guard
        client_body_timeout 60s;    # max gap between upload body reads
        limit_conn per_ip_conn 500;

        # Security headers (HSTS is set at the Istio gateway). Darwin is never
        # framed, so framing is denied outright.
        server_tokens off;
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # FastAPI's interactive docs / schema map every API route: don't serve
        # them publicly. Regex runs on nginx's normalized URI (slashes merged,
        # %XX decoded, dot-segments resolved), so encoding tricks don't bypass it.
        location ~* ^/api/(docs|redoc|openapi\.json)(/|$) {
            return 404;
        }

        # Login/OIDC endpoints get a tighter per-IP budget.
        location ~ ^/api/auth/ {
            limit_req zone=per_ip_auth burst=100 nodelay;
            rewrite ^/api(/.*)$ $1 break;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_redirect off;
            proxy_pass http://api_server;
        }

        location ~ ^/api(.*)$ {
            limit_req zone=per_ip_api burst=500 nodelay;
            rewrite ^/api(/.*)$ $1 break;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_redirect off;
            proxy_pass http://api_server;
        }

        location / {
            limit_req zone=per_ip_web burst=1000 nodelay;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_redirect off;
            proxy_pass http://web_server;
        }
    }
