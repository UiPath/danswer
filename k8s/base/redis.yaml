apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
          name: redis
        args:
        - --appendonly
        - 'no'
        - --save
        - ''
        - --maxmemory
        - 512mb
        - --maxmemory-policy
        - allkeys-lru
        # Container limit sits comfortably above --maxmemory because Redis
        # uses extra RSS beyond the data limit for client output buffers,
        # COW pages during BGSAVE, and fragmentation (~1.3-1.5x is typical;
        # we set ~2x for safety on a single-replica setup where OOM = downtime).
        resources:
          requests:
            memory: 256Mi
            cpu: 50m
          limits:
            memory: 1Gi
            cpu: 500m
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 15
          periodSeconds: 20
