apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
      - env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: postgres_user
              name: danswer-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres_password
              name: danswer-secrets
        envFrom:
        - configMapRef:
            name: env-configmap
        image: danswer-web-server
        imagePullPolicy: IfNotPresent
        name: web-server
        ports:
        - containerPort: 3000
          protocol: TCP
        # Zero-downtime rolling upgrade: the Service only sends traffic once the
        # new pod actually serves, and (with maxUnavailable rounding to 0) the old
        # pod is kept until the new one is Ready — so no request hits a booting pod.
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Grace for the Next.js server to come up before readiness is enforced.
        startupProbe:
          httpGet:
            path: /
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        resources:
          requests:
            cpu: 500m
            memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web-server-service
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 3000
  selector:
    app: web-server
  type: ClusterIP
