# App secrets reach the backend containers as FILES under /mnt/secrets (one
# file per env var, named after the variable), never via envFrom/secretKeyRef.
# with-secrets.sh exports each file as an env var and then execs the real
# command, so the app keeps reading os.environ unchanged.
#
# Where /mnt/secrets comes from is an overlay decision:
#   - prod:  Azure Key Vault (darwin-prod-kv) via the Secrets Store CSI driver
#            and workload identity — no Kubernetes Secret object exists at all.
#   - local: the danswer-secrets Secret, rendered from darwin-dev-kv by
#            k8s/scripts/sync-local-secrets.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: darwin-workload
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-loader
data:
  with-secrets.sh: |
    #!/bin/sh
    # Export every /mnt/secrets/<NAME> file as $NAME, then exec "$@".
    # Dotfiles (the volume's ..data bookkeeping) are skipped by the glob.
    for f in /mnt/secrets/*; do
      [ -f "$f" ] || continue
      n=$(basename "$f")
      case "$n" in
        [!A-Za-z_]*|*[!A-Za-z0-9_]*) continue ;;
      esac
      export "$n=$(cat "$f")"
    done
    exec "$@"
