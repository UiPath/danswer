apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: background
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: background
    spec:
      containers:
      - command:
        - /bin/sh
        - /opt/secrets-loader/with-secrets.sh
        - /usr/bin/supervisord
        envFrom:
        - configMapRef:
            name: env-configmap
        image: danswer-backend
        imagePullPolicy: IfNotPresent
        name: background
        resources:
          requests:
            cpu: '2'
            memory: 10Gi
          limits:
            cpu: '2'
            memory: 12Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/danswer
        - name: app-secrets
          mountPath: /mnt/secrets
          readOnly: true
        - name: secrets-loader
          mountPath: /opt/secrets-loader
          readOnly: true
      serviceAccountName: darwin-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      volumes:
      - name: tmp
        emptyDir: {}
      - name: home
        emptyDir: {}
      - name: app-secrets
        secret:
          secretName: danswer-secrets
      - name: secrets-loader
        configMap:
          name: secrets-loader
