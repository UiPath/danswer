apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vespa-configserver
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 3
  selector:
    matchLabels:
      app: vespa-configserver
      name: vespa-internal
  serviceName: vespa-internal
  template:
    metadata:
      labels:
        app: vespa-configserver
        name: vespa-internal
    spec:
      containers:
      - args:
        - configserver,services
        envFrom:
        - configMapRef:
            name: vespa-config
        image: vespa
        imagePullPolicy: Always
        name: vespa-configserver
        resources:
          limits:
            memory: 4096M
          requests:
            memory: 4096M
        securityContext:
          runAsUser: 1000
        volumeMounts:
        - mountPath: /opt/vespa/var
          name: vespa-var1
        - mountPath: /opt/vespa/logs
          name: vespa-logs1
        - mountPath: /workspace
          name: vespa-workspace1
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 1000 /opt/vespa/var
        image: busybox
        imagePullPolicy: Always
        name: chown-var
        resources: {}
        securityContext:
          runAsUser: 0
        volumeMounts:
        - mountPath: /opt/vespa/var
          name: vespa-var1
      - command:
        - sh
        - -c
        - chown -R 1000 /opt/vespa/logs
        image: busybox
        imagePullPolicy: Always
        name: chown-logs
        resources: {}
        securityContext:
          runAsUser: 0
        volumeMounts:
        - mountPath: /opt/vespa/logs
          name: vespa-logs1
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      name: vespa-var1
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      volumeMode: Filesystem
    status:
      phase: Pending
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      name: vespa-logs1
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      volumeMode: Filesystem
    status:
      phase: Pending
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      name: vespa-workspace1
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      volumeMode: Filesystem
    status:
      phase: Pending
---
apiVersion: v1
kind: Service
metadata:
  name: vespa-configserver
spec:
  ports:
  - name: vespa-tenant-port
    nodePort: 31439
    port: 19071
    protocol: TCP
    targetPort: 19071
  selector:
    app: vespa-configserver
  type: NodePort
