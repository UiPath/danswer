apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - command:
        - /bin/sh
        - /opt/secrets-loader/with-secrets.sh
        - /bin/sh
        - -c
        - 'alembic upgrade heads &&

          echo "Starting Danswer Api Server" &&

          uvicorn danswer.main:app --host 0.0.0.0 --port 8080

          '
        envFrom:
        - configMapRef:
            name: env-configmap
        image: danswer-backend
        imagePullPolicy: IfNotPresent
        name: api-server
        ports:
        - containerPort: 8080
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/danswer
        - name: app-secrets
          mountPath: /mnt/secrets
          readOnly: true
        - name: secrets-loader
          mountPath: /opt/secrets-loader
          readOnly: true
      serviceAccountName: darwin-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      volumes:
      - name: tmp
        emptyDir: {}
      - name: home
        emptyDir: {}
      - name: app-secrets
        secret:
          secretName: danswer-secrets
      - name: secrets-loader
        configMap:
          name: secrets-loader
---
apiVersion: v1
kind: Service
metadata:
  name: api-server-service
spec:
  ports:
  - name: api-server-port
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: api-server
  type: ClusterIP
