apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - 'alembic upgrade heads &&

          echo "Starting Danswer Api Server" &&

          uvicorn danswer.main:app --host 0.0.0.0 --port 8080

          '
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: postgres_user
              name: danswer-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres_password
              name: danswer-secrets
        - name: OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              key: oauth_client_id
              name: danswer-secrets
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: oauth_client_secret
              name: danswer-secrets
        - name: USER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              key: user_auth_secret
              name: danswer-secrets
        envFrom:
        - configMapRef:
            name: env-configmap
        - secretRef:
            name: danswer-secrets
        image: danswer-backend
        imagePullPolicy: IfNotPresent
        name: api-server
        ports:
        - containerPort: 8080
          protocol: TCP
        resources: {}
        volumeMounts:
        - mountPath: /home/storage
          name: dynamic-storage
        - mountPath: /home/file_connector_storage
          name: file-connector-storage
      volumes:
      - name: dynamic-storage
        persistentVolumeClaim:
          claimName: dynamic-pvc
      - name: file-connector-storage
        persistentVolumeClaim:
          claimName: file-connector-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api-server-service
spec:
  ports:
  - name: api-server-port
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: api-server
  type: ClusterIP
