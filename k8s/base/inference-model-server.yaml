# Runs as uid 1001 (upstream image runs as root by default). The model cache
# volume is mounted at /model-cache (was /root/.cache) with HF_HOME pointing
# into it; fsGroup makes the existing cached files readable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-model-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-model-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: inference-model-server
    spec:
      containers:
      - command:
        - uvicorn
        - model_server.main:app
        - --host
        - 0.0.0.0
        - --port
        - '9000'
        envFrom:
        - configMapRef:
            name: env-configmap
        image: danswer-model-server
        imagePullPolicy: IfNotPresent
        name: inference-model-server
        ports:
        - containerPort: 9000
          protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            cpu: '8'      # = node size: satisfies the limits policy, no throttling
            memory: 6Gi
        volumeMounts:
        - mountPath: /model-cache
          name: inference-model-storage
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        env:
        - name: HF_HOME
          value: /model-cache/huggingface
        - name: HOME
          value: /tmp
      volumes:
      - name: inference-model-storage
        persistentVolumeClaim:
          claimName: inference-model-pvc
      - name: tmp
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: inference-model-server-service
spec:
  ports:
  - name: inference-model-server-port
    port: 9000
    protocol: TCP
    targetPort: 9000
  selector:
    app: inference-model-server
  type: ClusterIP
