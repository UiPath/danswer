apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vespa-content
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 3
  selector:
    matchLabels:
      app: vespa-content
      name: vespa-internal
  serviceName: vespa-internal
  template:
    metadata:
      labels:
        app: vespa-content
        name: vespa-internal
    spec:
      containers:
      - args:
        - services
        envFrom:
        - configMapRef:
            name: vespa-config
        # Per-role logical image name — see vespa-configserver.yaml.
        image: vespa-content
        imagePullPolicy: Always
        name: vespa-content
        # Readiness on the metrics proxy's /state/v1/health (port 19092 —
        # verified serving 200 on the live content nodes; this port exists on
        # every Vespa node type, unlike the containers' 8080). Gates rollout
        # so an upgrade won't move to the next content pod until this one is
        # back up. Readiness-only — NO liveness (a slow content node loading
        # its index must not be killed). Crucially, vespa-internal sets
        # publishNotReadyAddresses: true, so a not-ready content pod is still
        # resolvable for peer discovery — this probe gates rollout WITHOUT
        # dropping the node from the cluster. initialDelay is generous because
        # content nodes load buckets on boot.
        readinessProbe:
          httpGet:
            path: /state/v1/health
            port: 19092
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          limits:
            memory: 12G
          requests:
            memory: 6G
        securityContext:
          runAsUser: 1000
        volumeMounts:
        - mountPath: /opt/vespa/var
          name: vespa-var
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 1000 /opt/vespa/var
        image: busybox
        imagePullPolicy: Always
        name: chown-var
        resources: {}
        securityContext:
          runAsUser: 0
        volumeMounts:
        - mountPath: /opt/vespa/var
          name: vespa-var
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      name: vespa-var
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 100Gi
      volumeMode: Filesystem
    status:
      phase: Pending
