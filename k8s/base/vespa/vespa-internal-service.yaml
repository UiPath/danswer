# Runs as vespa (uid/gid 1000) via the pod securityContext; fsGroup keeps the
# data volumes group-owned by 1000 (replaces the old root chown-* init containers).
apiVersion: v1
kind: Service
metadata:
  labels:
    name: vespa-internal
  name: vespa-internal
spec:
  clusterIP: None
  clusterIPs:
  - None
  publishNotReadyAddresses: true
  selector:
    name: vespa-internal
  type: ClusterIP
