# Runs as vespa (uid/gid 1000) via the pod securityContext; fsGroup keeps the
# data volumes group-owned by 1000 (replaces the old root chown-* init containers).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vespa-configserver
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: vespa-configserver
      name: vespa-internal
  serviceName: vespa-internal
  template:
    metadata:
      labels:
        app: vespa-configserver
        name: vespa-internal
    spec:
      containers:
      - args:
        - configserver,services
        envFrom:
        - configMapRef:
            name: vespa-config
        image: vespa-configserver
        imagePullPolicy: Always
        name: vespa-configserver
        readinessProbe:
          httpGet:
            path: /state/v1/health
            port: 19071
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          limits:
            cpu: '8'   # = node size: policy needs a limit; no throttling, same thread sizing
            memory: 4096M
          requests:
            # explicit: a cpu limit without a request defaults the request to the limit (8 = unschedulable)
            cpu: 200m
            memory: 4096M
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        # configserver creates preprocess temp dirs under /opt/vespa/conf at startup
        - mountPath: /opt/vespa/conf
          name: vespa-conf-ephemeral
        - mountPath: /opt/vespa/var
          name: vespa-var1
        - mountPath: /opt/vespa/logs
          name: vespa-logs1
        - mountPath: /workspace
          name: vespa-workspace1
      # Read-only root FS: /opt/vespa/conf ships the config definitions and the
      # configserver also writes temp dirs there; copy the image's contents in first.
      initContainers:
      - name: seed-vespa-dirs
        image: vespa-configserver
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "set -e; for e in /opt/vespa/conf/* /opt/vespa/conf/.[!.]*; do [ -e \"$e\" ] || continue; cp -a \"$e\" /seed/conf/; done"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /seed/conf
          name: vespa-conf-ephemeral
      volumes:
      - name: tmp
        emptyDir: {}
      - name: vespa-conf-ephemeral
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      name: vespa-var1
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      volumeMode: Filesystem
    status:
      phase: Pending
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      name: vespa-logs1
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      volumeMode: Filesystem
    status:
      phase: Pending
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      name: vespa-workspace1
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      volumeMode: Filesystem
    status:
      phase: Pending
---
apiVersion: v1
kind: Service
metadata:
  name: vespa-configserver
spec:
  ports:
  - name: vespa-tenant-port
    port: 19071
    protocol: TCP
    targetPort: 19071
  selector:
    app: vespa-configserver
  type: ClusterIP
