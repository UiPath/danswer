# Runs as vespa (uid/gid 1000) via the pod securityContext; fsGroup keeps the
# data volumes group-owned by 1000 (replaces the old root chown-* init containers).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vespa-feed-container
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 2
  selector:
    matchLabels:
      app: vespa-feed-container
      name: vespa-internal
  serviceName: vespa-internal
  template:
    metadata:
      labels:
        app: vespa-feed-container
        name: vespa-internal
    spec:
      containers:
      - args:
        - services
        envFrom:
        - configMapRef:
            name: vespa-config
        image: vespa-feed
        imagePullPolicy: Always
        name: vespa-feed-container
        readinessProbe:
          httpGet:
            path: /state/v1/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          limits:
            cpu: '8'   # = node size: policy needs a limit; no throttling, same thread sizing
            memory: 4G
          requests:
            # explicit: a cpu limit without a request defaults the request to the limit (8 = unschedulable)
            cpu: 250m
            memory: 1500M
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /opt/vespa/var
          name: vespa-var-ephemeral
        - mountPath: /opt/vespa/logs
          name: vespa-logs-ephemeral
      # Read-only root FS: the image ships a directory skeleton under
      # /opt/vespa/{var,logs} that a bare emptyDir would hide; copy it in first.
      initContainers:
      - name: seed-vespa-dirs
        image: vespa-feed
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "set -e; for e in /opt/vespa/var/* /opt/vespa/var/.[!.]*; do [ -e \"$e\" ] || continue; cp -a \"$e\" /seed/var/; done && for e in /opt/vespa/logs/* /opt/vespa/logs/.[!.]*; do [ -e \"$e\" ] || continue; cp -a \"$e\" /seed/logs/; done"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /seed/var
          name: vespa-var-ephemeral
        - mountPath: /seed/logs
          name: vespa-logs-ephemeral
      volumes:
      - name: tmp
        emptyDir: {}
      - name: vespa-var-ephemeral
        emptyDir: {}
      - name: vespa-logs-ephemeral
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: vespa
  name: vespa-feed
spec:
  ports:
  - name: api
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: vespa-feed-container
  type: ClusterIP
