# Strategic-merge patch: move the inference model server onto the GPU node pool
# and have it serve the cross-encoder reranker alongside the embedding + intent
# models (co-located, per the "deploy rerank + other inference models together
# on GPU" decision).
#
# Adjust the nodeSelector label/value and the toleration to match your GPU node
# pool. On AKS a GPU pool is typically labelled `agentpool: <name>` (or
# `kubernetes.azure.com/agentpool`) and tainted `sku=gpu:NoSchedule`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-model-server-deployment
spec:
  template:
    spec:
      # Pin to the GPU pool (single node — we accept single-GPU-node risk: if it
      # is down, search/embedding degrade, not just reranking).
      nodeSelector:
        agentpool: gpupool
      # GPU node pool taint: sku=gpu:NoSchedule (confirmed).
      tolerations:
      - key: sku
        operator: Equal
        value: gpu
        effect: NoSchedule
      containers:
      - name: inference-model-server
        env:
        # Stronger reranker than the xsmall default; trivially fast on a V100.
        # No reindex — the reranker only scores chunk text at query time.
        - name: RERANK_MODEL_NAME
          value: BAAI/bge-reranker-v2-m3
        # NOTE: RERANK_ENABLED=true must also be set in the overlay's
        # env.properties so it reaches BOTH this model server (warms the
        # reranker at boot) AND the api-server/background pods (so the app
        # actually reranks for opted-in assistants). It is intentionally NOT
        # set here so the single source of truth stays the shared configmap.
        resources:
          # Replaces the empty `resources: {}` in base — also fixes the
          # no-requests/limits smell that made this pod eviction-prone.
          requests:
            cpu: '2'
            memory: 8Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '4'
            memory: 12Gi
            nvidia.com/gpu: '1'
