# Kustomize Component — GPU-backed inference + cross-encoder reranking.
#
# The "global flag" half of the incremental reranking rollout. Opting an
# overlay into this component:
#   - schedules the inference-model-server onto the GPU node pool (patch in
#     inference-model-server-gpu.yaml) and gives it a `nvidia.com/gpu` request,
#   - serves the cross-encoder reranker (RERANK_MODEL_NAME, default
#     BAAI/bge-reranker-v2-m3) alongside the embedding + intent models.
#
# This patch only handles the model-server pod. You MUST ALSO set, in the
# including overlay's env.properties (so it reaches every pod via env-configmap):
#
#     RERANK_ENABLED=true
#
# That is the app-side master switch: with it on, the api-server/background
# pods rerank for assistants whose `rerank_enabled` flag is set (toggled per
# assistant in the admin UI). With it OFF — and by NOT including this component,
# which is how local/dev runs — reranking never runs and NO GPU is required.
#
# Opt in from an overlay:
#   # k8s/overlays/prod/kustomization.yaml
#   components:
#     - ../../optional/gpu-inference
#   # + add `RERANK_ENABLED=true` to env.properties
#
# Prereqs on the cluster: a GPU node pool (e.g. Standard_NC6s_v3 / V100) with
# the NVIDIA device plugin so `nvidia.com/gpu` is schedulable. The existing
# danswer-model-server image already bundles CUDA torch — no rebuild needed.
# Adjust the nodeSelector/toleration in the patch to match your pool.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: inference-model-server-gpu.yaml
    target:
      kind: Deployment
      name: inference-model-server-deployment
