# Hugging Face Text-Embeddings-Inference (TEI) serving the cross-encoder
# reranker on CPU at full precision (FP32). CPU-optimized (Rust + native token
# batching), so no GPU is needed. The app reaches it via RERANK_SERVER_URL
# (set in the overlay's env.properties) → its /rerank endpoint.
#
# Scaling: stateless — bump `replicas` (or add an HPA on CPU) for more
# rerank throughput. Rule of thumb ~4 vCPU + 4-8Gi per replica, ~1 replica
# per ~5 sustained rerank-QPS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-rerank-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tei-rerank
  template:
    metadata:
      labels:
        app: tei-rerank
    spec:
      containers:
        - name: tei-rerank
          # Our own image with BAAI/bge-reranker-v2-m3 baked in (see Dockerfile).
          # No runtime HuggingFace download → fast, reliable, offline; sidesteps
          # the stock-image download bug and the re-download-on-restart problem.
          image: sfbrdevhelmweacr.azurecr.io/danswer/tei-reranker:bge-v2-m3-2
          args:
            # Local path — the ONNX model is baked into the image at /model.
            - "--model-id"
            - "/model"
            - "--dtype"
            - "float32" # full precision: no accuracy loss vs GPU
            - "--port"
            - "80"
            # Bound memory/load so a burst queues instead of OOMing.
            - "--max-concurrent-requests"
            - "64"
            - "--max-batch-tokens"
            - "16384"
            - "--max-client-batch-size"
            - "32"
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "4" # request==limit cpu → predictable rerank latency
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 30
          # Model is baked in (loaded from the image's /data), so startup is
          # just model load — but keep headroom for CPU model init.
          startupProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tei-rerank-service
spec:
  ports:
    - name: tei-rerank-port
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: tei-rerank
  type: ClusterIP
