apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-indexer-scheduler-deployment
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: background-indexer-scheduler
  template:
    metadata:
      labels:
        app: background-indexer-scheduler
    spec:
      containers:
      - name: indexer-scheduler
        image: danswer-backend
        imagePullPolicy: IfNotPresent
        command:
        - python
        - danswer/background/update.py
        env:
        - name: DASK_SCHEDULER_ADDRESS
          value: tcp://dask-scheduler-service:8786
        - name: CURRENT_PROCESS_IS_AN_INDEXING_JOB
          value: 'true'
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: postgres_user
              name: danswer-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres_password
              name: danswer-secrets
        envFrom:
        - configMapRef:
            name: env-configmap
        - secretRef:
            name: danswer-secrets
        # No PVCs — the scheduler only polls Postgres + submits Dask futures;
        # the file store / dynamic config are Postgres-backed (see README).
        #
        # The per-cycle spikes to ~7.5Gi were a query bug, NOT real work: the
        # scheduler's get_last_attempt() ran an unbounded ORDER BY without
        # LIMIT once per cc-pair, materializing each cc-pair's FULL
        # index_attempt history (12k+ rows for active connectors) just to take
        # the newest. Fixed with LIMIT 1 in db/index_attempt.py — steady-state
        # is now ~700Mi.
        #
        # TEMP: 12Gi only while the PRE-FIX backend image is still running
        # (it still spikes). Once an image WITH the LIMIT-1 fix is deployed,
        # drop this to request 512Mi / limit 2Gi.
        resources:
          requests:
            cpu: 200m
            memory: 4Gi
          limits:
            cpu: 500m
            memory: 12Gi
