apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-indexer-scheduler-deployment
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: background-indexer-scheduler
  template:
    metadata:
      labels:
        app: background-indexer-scheduler
    spec:
      containers:
      - name: indexer-scheduler
        image: danswer-backend
        imagePullPolicy: IfNotPresent
        command:
        - python
        - danswer/background/update.py
        env:
        - name: DASK_SCHEDULER_ADDRESS
          value: tcp://dask-scheduler-service:8786
        - name: CURRENT_PROCESS_IS_AN_INDEXING_JOB
          value: 'true'
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: postgres_user
              name: danswer-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres_password
              name: danswer-secrets
        envFrom:
        - configMapRef:
            name: env-configmap
        - secretRef:
            name: danswer-secrets
        # No PVCs — the scheduler only polls Postgres + submits Dask futures;
        # the file store / dynamic config are Postgres-backed (see README).
        # The update.py loop imports the full app, warms the embedding model,
        # holds a Dask client, and pulls connector/index state into memory each
        # cycle — observed to SPIKE from ~300Mi baseline to >4Gi within a
        # single "Running update" pass. OOMKilled (137) at 1Gi, 2Gi AND 4Gi
        # limits (~every 2 min). The old combined `background` pod reserved
        # 10Gi and absorbed this; the split scheduler needs comparable room.
        # 8Gi limit / 4Gi request gives headroom for the spike. If it STILL
        # OOMs at 8Gi, that's a memory-growth bug in the update loop to
        # investigate in code — not a sizing problem.
        resources:
          requests:
            cpu: 200m
            memory: 4Gi
          limits:
            cpu: 500m
            memory: 8Gi
