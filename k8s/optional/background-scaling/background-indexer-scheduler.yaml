apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-indexer-scheduler-deployment
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: background-indexer-scheduler
  template:
    metadata:
      labels:
        app: background-indexer-scheduler
    spec:
      containers:
      - name: indexer-scheduler
        image: danswer-backend
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - /opt/secrets-loader/with-secrets.sh
        - python
        - danswer/background/update.py
        env:
        - name: DASK_SCHEDULER_ADDRESS
          value: tcp://dask-scheduler-service:8786
        - name: CURRENT_PROCESS_IS_AN_INDEXING_JOB
          value: 'true'
        envFrom:
        - configMapRef:
            name: env-configmap
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/danswer
        - name: app-secrets
          mountPath: /mnt/secrets
          readOnly: true
        - name: secrets-loader
          mountPath: /opt/secrets-loader
          readOnly: true
      serviceAccountName: darwin-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      volumes:
      - name: tmp
        emptyDir: {}
      - name: home
        emptyDir: {}
      - name: app-secrets
        secret:
          secretName: danswer-secrets
      - name: secrets-loader
        configMap:
          name: secrets-loader
