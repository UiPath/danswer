# background-lite — the low-traffic singletons that don't scale with
# indexing load, co-located in one pod as three containers:
#   - celery-worker    maintenance tasks (prune/sync/deletion/analytics);
#                       autoscales 3-10 threads inside this one container
#   - celery-beat      periodic-task scheduler (singleton)
#   - slack-listener   Slack Socket Mode websocket (singleton)
#
# This replaces three separate deployments (background-celery,
# background-beat, slack-listener) — none of them benefits from being its
# own Deployment for the indexing-scaling goal, and collapsing them trims
# the pod count and per-deployment resource reservations.
#
# Indexing is deliberately NOT here — that's the Dask path
# (background-indexer-scheduler → dask-scheduler → dask-worker), which is
# the part that actually scales.
#
# SINGLETON: replicas managed in kustomization.yaml at count: 1. The pod
# contains celery-beat (dup beats double-fire periodic tasks) and the
# Slack websocket listener (dup double-processes events), so this pod
# must never run more than one replica. Each container restarts
# independently if it crashes; the pod is rescheduled as a unit.
#
# Env-neutral like the rest of the component (logical danswer-backend
# image; config via env-configmap, secrets as files under /mnt/secrets —
# see base/secrets-loader.yaml). The Slack tokens reach the listener as
# env vars exported by with-secrets.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-lite-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: background-lite
  template:
    metadata:
      labels:
        app: background-lite
    spec:
      containers:
      - name: celery-worker
        image: danswer-backend
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - /opt/secrets-loader/with-secrets.sh
        - celery
        - -A
        - danswer.background.celery.celery_run:celery_app
        - worker
        - --pool=threads
        - --concurrency=10
        - --loglevel=INFO
        envFrom:
        - configMapRef:
            name: env-configmap
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: &id001
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/danswer
        - name: app-secrets
          mountPath: /mnt/secrets
          readOnly: true
        - name: secrets-loader
          mountPath: /opt/secrets-loader
          readOnly: true
      - name: celery-beat
        image: danswer-backend
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - /opt/secrets-loader/with-secrets.sh
        - celery
        - -A
        - danswer.background.celery.celery_run:celery_app
        - beat
        - --schedule=/tmp/celerybeat-schedule
        - --loglevel=INFO
        envFrom:
        - configMapRef:
            name: env-configmap
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            cpu: 200m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: *id001
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/danswer
        - name: app-secrets
          mountPath: /mnt/secrets
          readOnly: true
        - name: secrets-loader
          mountPath: /opt/secrets-loader
          readOnly: true
      - name: slack-listener
        image: danswer-backend
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - /opt/secrets-loader/with-secrets.sh
        - python
        - danswer/danswerbot/slack/listener.py
        envFrom:
        - configMapRef:
            name: env-configmap
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: *id001
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/danswer
        - name: app-secrets
          mountPath: /mnt/secrets
          readOnly: true
        - name: secrets-loader
          mountPath: /opt/secrets-loader
          readOnly: true
      serviceAccountName: darwin-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      volumes:
      - name: tmp
        emptyDir: {}
      - name: home
        emptyDir: {}
      - name: app-secrets
        secret:
          secretName: danswer-secrets
      - name: secrets-loader
        configMap:
          name: secrets-loader
