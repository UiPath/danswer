apiVersion: apps/v1
kind: Deployment
metadata:
  name: dask-worker-deployment
spec:
  selector:
    matchLabels:
      app: dask-worker
  template:
    metadata:
      labels:
        app: dask-worker
    spec:
      containers:
      - name: worker
        image: danswer-backend
        imagePullPolicy: IfNotPresent
        command:
        - dask
        - worker
        - tcp://dask-scheduler-service:8786
        - --nworkers=1
        - --nthreads=1
        - --memory-limit=4GB
        env:
        - name: PYTHONPATH
          value: /app
        - name: CURRENT_PROCESS_IS_AN_INDEXING_JOB
          value: 'true'
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: postgres_user
              name: danswer-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres_password
              name: danswer-secrets
        envFrom:
        - configMapRef:
            name: env-configmap
        - secretRef:
            name: danswer-secrets
        # No PVCs — indexing reads File-connector uploads from PGFileStore
        # (Postgres large objects), not /home/file_connector_storage; the
        # dynamic config store is Postgres-backed too. Connector temp files
        # (if any) go to the container's /tmp. This also keeps each worker
        # off the RWO dynamic-pvc, which can't multi-attach. See README.
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 4Gi
