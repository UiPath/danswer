apiVersion: apps/v1
kind: Deployment
metadata:
  name: dask-worker-deployment
spec:
  selector:
    matchLabels:
      app: dask-worker
  template:
    metadata:
      labels:
        app: dask-worker
    spec:
      containers:
      - name: worker
        image: danswer-backend
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - /opt/secrets-loader/with-secrets.sh
        - /bin/sh
        - -c
        - "until python -c \"import socket; socket.create_connection(('dask-scheduler-service',\
          \ 8786), timeout=3)\" 2>/dev/null; do\n  echo \"waiting for dask-scheduler-service:8786...\"\
          \n  sleep 2\ndone\necho \"dask-scheduler reachable; starting worker\"\n\
          exec dask worker tcp://dask-scheduler-service:8786 --nworkers=1 --nthreads=1\
          \ --memory-limit=8GB\n"
        env:
        - name: PYTHONPATH
          value: /app
        - name: CURRENT_PROCESS_IS_AN_INDEXING_JOB
          value: 'true'
        - name: MALLOC_TRIM_THRESHOLD_
          value: '0'
        - name: SHAREPOINT_DOWNLOAD_DIR
          value: /scratch/sp-downloads
        envFrom:
        - configMapRef:
            name: env-configmap
        volumeMounts:
        - name: sp-scratch
          mountPath: /scratch/sp-downloads
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/danswer
        - name: app-secrets
          mountPath: /mnt/secrets
          readOnly: true
        - name: secrets-loader
          mountPath: /opt/secrets-loader
          readOnly: true
        resources:
          requests:
            cpu: '1'
            memory: 4Gi
          limits:
            cpu: '2'
            memory: 8Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      volumes:
      - name: sp-scratch
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir: {}
      - name: home
        emptyDir: {}
      - name: app-secrets
        secret:
          secretName: danswer-secrets
      - name: secrets-loader
        configMap:
          name: secrets-loader
      serviceAccountName: darwin-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
