# Kustomize Component — opt-in in-cluster Redis StatefulSet.
#
# Include from an overlay (e.g. overlays/local) by adding to its
# kustomization.yaml:
#
#   components:
#     - ../../optional/redis
#
# Prod typically uses managed Redis (Azure Cache for Redis or equivalent)
# and does NOT include this component — it points REDIS_HOST at the
# managed FQDN in env.properties and puts the access key in secrets.env.
#
# This is also plainly applicable via `kubectl apply -k k8s/optional/redis`
# or `kubectl apply -f k8s/optional/redis/redis.yaml` if you want it
# outside any overlay.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - redis.yaml
