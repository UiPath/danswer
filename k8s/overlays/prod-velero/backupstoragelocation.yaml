# Where Velero stores backup metadata (object storage). Reuses the existing
# storage account + container the old Velero used (now purged) — the SP
# 155fae3c already holds Contributor on RG darwin-backups.
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
spec:
  provider: velero.io/azure
  objectStorage:
    bucket: darwinaksbackup
  config:
    resourceGroup: darwin-backups
    storageAccount: darwinaksbackup
    subscriptionId: 202e5d15-5356-4826-bc61-ebd449d12e34
