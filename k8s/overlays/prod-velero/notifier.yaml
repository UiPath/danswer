# Post-backup notifier: every week, AFTER the backup window, read the latest
# vespa-weekly backup's status and post the outcome (success AND failure) to
# #darwin-devs via the Slack bot token. This is the "did the weekly backup
# happen and did it work?" heartbeat to the team channel.
#
# (The PrometheusRule alerts are the real-time failure safety net via robusta;
# this CronJob is the explicit per-run success/failure report to darwin-devs.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero-backup-notifier
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velero-backup-notifier
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
rules:
- apiGroups:
  - velero.io
  resources:
  - backups
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velero-backup-notifier
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
subjects:
- kind: ServiceAccount
  name: velero-backup-notifier
  namespace: velero
roleRef:
  kind: Role
  name: velero-backup-notifier
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: velero-backup-notifier
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
spec:
  schedule: 0 3 * * 0
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: velero
        spec:
          serviceAccountName: velero-backup-notifier
          restartPolicy: Never
          containers:
          - name: notifier
            image: alpine/k8s:1.29.4
            command:
            - /bin/bash
            - -c
            args:
            - "set -euo pipefail\nitems=$(kubectl get backups.velero.io -n velero\
              \ \\\n  -l velero.io/schedule-name=vespa-weekly -o json)\nlatest=$(echo\
              \ \"$items\" | jq -r '.items | sort_by(.metadata.creationTimestamp)\
              \ | last')\nif [ \"$latest\" = \"null\" ] || [ -z \"$latest\" ]; then\n\
              \  name=\"(none)\"; phase=\"NoBackupFound\"; errs=\"-\"; comp=\"-\"\n\
              else\n  name=$(echo \"$latest\" | jq -r '.metadata.name')\n  phase=$(echo\
              \ \"$latest\" | jq -r '.status.phase // \"Unknown\"')\n  errs=$(echo\
              \ \"$latest\" | jq -r '.status.errors // 0')\n  comp=$(echo \"$latest\"\
              \ | jq -r '.status.completionTimestamp // \"-\"')\nfi\ncase \"$phase\"\
              \ in\n  Completed) emoji=\"\u2705\" ;;\n  PartiallyFailed) emoji=\"\u26A0\
              \uFE0F\" ;;\n  *) emoji=\"\u274C\" ;;\nesac\ntext=$(printf '%s Vespa\
              \ weekly backup *%s*\\nbackup: `%s`\\nerrors: %s\\ncompleted: %s' \\\
              \n  \"$emoji\" \"$phase\" \"$name\" \"$errs\" \"$comp\")\npayload=$(jq\
              \ -nc --arg c \"$SLACK_CHANNEL\" --arg t \"$text\" '{channel:$c,text:$t}')\n\
              resp=$(curl -sf -X POST https://slack.com/api/chat.postMessage \\\n\
              \  -H \"Authorization: Bearer $SLACK_BOT_TOKEN\" \\\n  -H \"Content-type:\
              \ application/json; charset=utf-8\" \\\n  --data \"$payload\")\necho\
              \ \"$resp\"\necho \"$resp\" | jq -e '.ok == true' >/dev/null \\\n  ||\
              \ { echo \"ERROR: slack post failed\"; exit 1; }\n"
            env:
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-notify
                  key: SLACK_BOT_TOKEN
            - name: SLACK_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: slack-notify
                  key: SLACK_CHANNEL
            - name: HOME          # kubectl's cache dir; root FS is read-only
              value: /tmp
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Explicit SA token (automount is off for the Azure Policy) —
            # the notifier reads Backup objects via kubectl.
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
          automountServiceAccountToken: false
          volumes:
          - name: tmp
            emptyDir: {}
          - name: kube-api-access
            projected:
              defaultMode: 0444
              sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3607}
              - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
              - downwardAPI:
                  items:
                  - path: namespace
                    fieldRef: {apiVersion: v1, fieldPath: metadata.namespace}
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 65534
            runAsGroup: 65534
