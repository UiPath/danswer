# ACME http-01 issuer for darwin.westeurope.cloudapp.azure.com. That name lives
# in Microsoft's cloudapp.azure.com zone, so dns-01 is impossible; http-01 needs
# inbound TCP 80 from the Internet (NSG rule for 98.64.205.95). Istio serves the
# solver Ingress (class istio). No email on purpose.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-http01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-http01
    solvers:
      - http01:
          ingress:
            ingressClassName: istio
