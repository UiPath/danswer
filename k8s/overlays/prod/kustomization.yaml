# Production overlay → Darwin AKS cluster (kubectl context: `darwin`).
#
# Single source of truth for the prod environment:
#   - env.properties         non-secret config (committed)
#   - secrets.env            real secrets (gitignored; copy from .example)
#   - images: below          which image tags this env runs
#   - replicas: below        deployment scaling
#
# Apply:    kubectl apply -k k8s/overlays/prod
# Preview:  kubectl kustomize k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - keyvault-secrets.yaml   # SecretProviderClass: app secrets from darwin-prod-kv

components:
  - ../../optional/background-scaling
  # GPU cross-encoder reranker. DISABLED (RERANK_ENABLED=false in env.properties),
  # so the tei-rerank component + GPU node pool are removed. To re-enable: set
  # RERANK_ENABLED=true + RERANK_SERVER_URL, re-add the component below, and add a
  # GPU node pool.
  # - ../../optional/tei-rerank

namespace: darwin

# Image refs are logical names in base/. Kustomize rewrites them to the
# concrete registry+tag below. Bump a `newTag` here to roll out a new
# image; no manifest edits required.
images:
  - name: danswer-backend
    newName: sfbrdevhelmweacr.azurecr.io/danswer/danswer-backend
    # vha-246 = vha-245 + OIDC login via federated credential (no client secret).
    # vha-245 = vha-244 + passwordless Blob (managed identity) + direct-upload flag.
    # vha-244 = vha-243 + passwordless Postgres (Entra / workload identity).
    # vha-243 = vha-242 + GEN_AI_GATEWAY_BASE_URL. vha-242 = vha-239 + non-root user (uid 1001).
    # (vha-240/241 exist in the registry from another branch - never deployed.)
    newTag: vha-246
  - name: danswer-web-server
    newName: sfbrdevhelmweacr.azurecr.io/danswer/danswer-web-server
    newTag: vha-124
  - name: danswer-model-server
    newName: danswer/danswer-model-server
    newTag: v0.3.94
  - name: nginx
    newName: nginxinc/nginx-unprivileged
    newTag: 1.28.0-alpine
  # Vespa images live in the separate Vespa overlay (k8s/overlays/prod-vespa)
  # now that Vespa is applied independently of the app — see that file and
  # k8s/README.md.

replicas:
  - name: api-server-deployment
    count: 2
  - name: background-deployment
    count: 0
  - name: web-server-deployment
    count: 1
  - name: nginx-deployment
    count: 1
  - name: inference-model-server-deployment
    count: 1
  - name: background-lite-deployment              # singleton — beat + slack; never >1
    count: 1
  - name: background-indexer-scheduler-deployment # singleton — the update.py loop
    count: 1
  - name: dask-scheduler-deployment               # singleton
    count: 1
  - name: dask-worker-deployment                  # ← THE indexing-throughput knob
    count: 2

# env-configmap: regenerated from env.properties. `behavior: create` because
# base doesn't ship a ConfigMap with this name — the overlay owns it.
configMapGenerator:
  - name: env-configmap
    behavior: create
    envs:
      - env.properties

# No secretGenerator: prod secrets live only in Key Vault (keyvault-secrets.yaml).
# The patches below swap base's app-secrets volume (a danswer-secrets Secret,
# used by local) for the Key Vault CSI volume, and bind darwin-workload to
# managed identity darwin-workload-mi.
patches:
  - target:
      kind: Deployment
      name: ^(api-server|background|background-lite|background-indexer-scheduler|dask-worker)-deployment$
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
      spec:
        template:
          metadata:
            labels:
              # workload-identity webhook injects AZURE_CLIENT_ID / TENANT_ID /
              # FEDERATED_TOKEN_FILE — used for the passwordless Postgres login.
              azure.workload.identity/use: "true"
          spec:
            volumes:
              - name: app-secrets
                secret: null
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: darwin-app-secrets
  - target:
      kind: ServiceAccount
      name: darwin-workload
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: darwin-workload
        annotations:
          azure.workload.identity/client-id: e1f103a4-439c-45e2-8a3c-dc8aab27df89

# Without this kustomize appends a content-hash suffix to generated names
# (e.g. env-configmap-abc123). Disabled so deployments' explicit
# configMapRef name=env-configmap continues to resolve.
generatorOptions:
  disableNameSuffixHash: true
