# Prod app secrets come straight from Azure Key Vault `darwin-prod-kv` via the
# AKS Key Vault Secrets Provider add-on (Secrets Store CSI driver), mounted as
# files at /mnt/secrets and exported by base/secrets-loader.yaml's
# with-secrets.sh. There is deliberately NO `secretObjects:` block: nothing is
# synced into a Kubernetes Secret, so `kubectl get secrets` has nothing to leak.
#
# Postgres, Blob and the OIDC login have NO secret here: pods use managed
# identity darwin-workload-mi (POSTGRES_ENTRA_AUTH; AZURE_BLOB_ACCOUNT_URL;
# OAUTH_USE_WORKLOAD_IDENTITY via the federated credential on dex-oauth).
#
# Auth: workload identity. The CSI driver presents the pod's `darwin-workload`
# ServiceAccount token, federated to managed identity `darwin-workload-mi`
# (get/list on the vault via access policy). The vault is reachable only via
# private endpoint darwin-prod-kv-pe.
#
# Values are read when a pod starts (volume mount), never per request; a pod
# restart picks up a rotated value. To add a secret: `az keyvault secret set
# --vault-name darwin-prod-kv -n MY-NAME --file ...`, add an entry below with
# objectAlias = the env var name, re-apply, restart the consumers.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: darwin-app-secrets
spec:
  provider: azure
  parameters:
    clientID: e1f103a4-439c-45e2-8a3c-dc8aab27df89   # darwin-workload-mi
    keyvaultName: darwin-prod-kv
    tenantId: d8353d2a-b153-4d17-8827-902c51f72357
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    objects: |
      array:
        - |
          objectName: USER-AUTH-SECRET
          objectType: secret
          objectAlias: USER_AUTH_SECRET
        - |
          objectName: DANSWER-BOT-SLACK-APP-TOKEN
          objectType: secret
          objectAlias: DANSWER_BOT_SLACK_APP_TOKEN
        - |
          objectName: DANSWER-BOT-SLACK-BOT-TOKEN
          objectType: secret
          objectAlias: DANSWER_BOT_SLACK_BOT_TOKEN
        - |
          objectName: GEN-AI-CLIENT-SECRET
          objectType: secret
          objectAlias: GEN_AI_CLIENT_SECRET
        - |
          objectName: JIRA-API-TOKEN
          objectType: secret
          objectAlias: JIRA_API_TOKEN
