# East-west lockdown for Darwin's non-Vespa workloads: only pods in the darwin
# namespace (mTLS identity) may call them; nginx additionally accepts the Istio
# ingress gateway (public traffic). Anything else - other namespaces, plaintext
# callers without a sidecar - is denied by the workload's sidecar.
# Validated with istio.io/dry-run before enforcing (0 would-be denials).
# Vespa is handled separately (authz-vespa.yaml): its inter-node RPC uses
# undeclared ports that travel without mTLS, so a namespace ALLOW would break it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-server-allow-darwin-only
  namespace: darwin
spec:
  selector:
    matchLabels:
      app: api-server
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces:
        - darwin
---
