# Runtime security policy for the prod cluster (darwin).
#
#     kubectl apply -k k8s/overlays/prod-security     # context: darwin
#
# The AKS cluster has no NetworkPolicy engine (networkPolicy: none), so
# east-west restrictions are Istio AuthorizationPolicies enforced by the
# sidecars (mTLS identities).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - authz-darwin-workloads.yaml
  - authz-vespa.yaml
  - pod-security-namespaces.yaml
