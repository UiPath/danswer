# Dask worker pods — the actual indexing executors. (Darwin variant.)
#
# This is the deployment you scale to add indexing throughput. Each
# pod runs ONE Dask worker process with ONE thread. Two cc-pairs
# being indexed simultaneously land on two different pods, each with
# its own RAM/CPU envelope — no shared-memory contention.
#
# `--nworkers 1 --nthreads 1` is intentional:
#   - One worker per pod = each pod's RSS is bounded by its own
#     limit; no other Dask worker can OOM-kill it.
#   - One thread per worker = each pod runs at most one indexing
#     job at a time. Indexing is CPU+IO heavy; oversubscribing
#     threads just thrashes.
#
# Scale the deployment, not the workers per pod.
#
# Memory limit at 4Gi covers the worst case: a Highspot WebLink
# scrape (Playwright + Chromium ~300-500MB) running concurrently
# with file extraction of a large PDF (~500MB peak). Tune per
# observed P99 RSS.
#
# Per-cc-pair INDX advisory locks (acquired at task start, released
# at task end) prevent two workers from running the same cc-pair
# even if the scheduler somehow double-dispatches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dask-worker-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dask-worker
  template:
    metadata:
      labels:
        app: dask-worker
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: agentpool
                operator: In
                values:
                - indexcpu
      containers:
      - name: worker
        image: sfbrdevhelmweacr.azurecr.io/danswer/danswer-backend:vha-5
        imagePullPolicy: IfNotPresent
        command:
          - dask
          - worker
          - tcp://dask-scheduler-service:8786
          - --nworkers=1
          - --nthreads=1
          - --memory-limit=4GB
        env:
        # PYTHONPATH is required so the worker can deserialize the
        # `run_indexing_entrypoint` callable submitted from the
        # indexer-scheduler — it imports from
        # `danswer.background.indexing.run_indexing` which
        # transitively pulls all connector code.
        - name: PYTHONPATH
          value: "/app"
        - name: CURRENT_PROCESS_IS_AN_INDEXING_JOB
          value: "true"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: postgres_user
              name: danswer-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres_password
              name: danswer-secrets
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis_password
              name: danswer-secrets
              optional: true
        envFrom:
        - configMapRef:
            name: env-configmap
        volumeMounts:
        - name: dynamic-storage
          mountPath: /home/storage
        - name: file-connector-storage
          mountPath: /home/file_connector_storage
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
      tolerations:
      - effect: NoSchedule
        key: darwin
        operator: Equal
        value: indexing
      volumes:
      - name: dynamic-storage
        persistentVolumeClaim:
          claimName: dynamic-pvc
      - name: file-connector-storage
        persistentVolumeClaim:
          claimName: file-connector-pvc
