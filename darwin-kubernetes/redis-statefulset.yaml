# In-cluster Redis for cache + per-user rate limiting.
#
# Cache-only: persistence is deliberately OFF (no AOF, no RDB snapshots). A
# pod restart drops the cache; that's acceptable because the
# DynamicConfigStore Postgres-backed source of truth refills it on demand
# and the rate-limit counters self-heal as windows expire.
#
# A single replica is fine for this footprint (a few hundred users). For HA
# later, switch to Redis Sentinel or move to Azure Cache for Redis — both
# are drop-in for our client, which only ever talks via REDIS_HOST.
#
# NOT the Celery broker. This fork uses Postgres for the broker by design
# (see AGENTS.md "Divergence from upstream Onyx"). Do not repoint Celery
# at this service.
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
              name: redis
          # Cache-only config: no persistence, bounded memory, LRU eviction.
          args:
            - "--appendonly"
            - "no"
            - "--save"
            - ""
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
