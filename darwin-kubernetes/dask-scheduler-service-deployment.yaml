# Dask scheduler — routes indexing tasks from the
# background-indexer-scheduler deployment to dask-worker pods.
# (Darwin variant.)
#
# Lightweight bookkeeping process: maintains the worker registry,
# keeps a queue of pending tasks, decides task placement based on
# worker free-slot count + heartbeats. ~100-200MB RSS in steady
# state. Single replica is fine — if it dies, K8s restarts it and
# the indexer-scheduler + worker pods auto-reconnect (a few seconds
# of stall, no data loss).
#
# Two ports:
#   8786 — RPC port that Client(...) and `dask worker` connect to.
#   8787 — web dashboard (extremely useful for operational debugging:
#          live task graph, worker resource usage, task durations).
#
# Lives on the indexcpu node pool so it co-locates with the workers
# it dispatches to — reduces cross-pool network hops on the hot path.
# Doesn't need Postgres or Redis — it's purely a Dask scheduler.
---
apiVersion: v1
kind: Service
metadata:
  name: dask-scheduler-service
spec:
  selector:
    app: dask-scheduler
  ports:
    - name: rpc
      protocol: TCP
      port: 8786
      targetPort: 8786
    - name: dashboard
      protocol: TCP
      port: 8787
      targetPort: 8787
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dask-scheduler-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dask-scheduler
  template:
    metadata:
      labels:
        app: dask-scheduler
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: agentpool
                operator: In
                values:
                - indexcpu
      containers:
      - name: scheduler
        image: sfbrdevhelmweacr.azurecr.io/danswer/danswer-backend:vha-5
        imagePullPolicy: IfNotPresent
        command:
          - dask
          - scheduler
          - --host=0.0.0.0
          - --port=8786
          - --dashboard-address=:8787
        ports:
        - name: rpc
          containerPort: 8786
        - name: dashboard
          containerPort: 8787
        envFrom:
        - configMapRef:
            name: env-configmap
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          tcpSocket:
            port: 8786
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8786
          initialDelaySeconds: 15
          periodSeconds: 20
      tolerations:
      - effect: NoSchedule
        key: darwin
        operator: Equal
        value: indexing
