# Indexer-scheduler — runs the polling loop in
# `danswer/background/update.py`. Every 10s it scans Postgres for
# cc-pairs due for re-indexing, creates index_attempt rows, and
# submits `run_indexing_entrypoint` tasks to the remote
# Dask scheduler service. The actual indexing CPU/RAM work happens
# on dask-worker pods, NOT here.
#
# Singleton (replicas: 1, strategy: Recreate). Scaling indexing
# concurrency = scaling dask-worker pods, not this one. Two
# scheduler loops would race on `index_attempt` table inserts.
#
# DASK_SCHEDULER_ADDRESS env switches `update.py` from
# in-process LocalCluster to the remote-scheduler client mode.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-indexer-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: background-indexer-scheduler
  template:
    metadata:
      labels:
        app: background-indexer-scheduler
    spec:
      containers:
        - name: indexer-scheduler
          image: danswer/danswer-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "danswer/background/update.py"]
          env:
            - name: DASK_SCHEDULER_ADDRESS
              value: "tcp://dask-scheduler-service:8786"
            - name: CURRENT_PROCESS_IS_AN_INDEXING_JOB
              value: "true"
          envFrom:
            - configMapRef:
                name: env-configmap
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
