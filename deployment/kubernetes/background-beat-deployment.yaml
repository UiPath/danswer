# Celery beat — periodic-task scheduler.
#
# MUST be a singleton: two beats on the same broker fire every
# crontab entry twice. `Recreate` strategy guarantees no overlap
# during rollout (the old pod is terminated before the new one
# starts), at the cost of a brief beat outage during deploy. That's
# acceptable because beat-fired tasks are all "check / catch-up"
# style — missing one cycle is harmless, the next one cleans up.
#
# Resource sizing: beat itself is tiny (it just dispatches to the
# Celery broker); 100m/128Mi is plenty.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: background-beat
  template:
    metadata:
      labels:
        app: background-beat
    spec:
      containers:
        - name: beat
          image: danswer/danswer-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - danswer.background.celery.celery_run:celery_app
            - beat
            - --loglevel=INFO
          envFrom:
            - configMapRef:
                name: env-configmap
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
